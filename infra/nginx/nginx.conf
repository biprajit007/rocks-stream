daemon off;
worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

rtmp {
  server {
    listen 1935;
    chunk_size 4096;

    application live {
      live on;
      record off;
      allow publish all;
      allow play all;
    }
  }
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;

  upstream frontend_upstream { server frontend:3000; }
  upstream backend_upstream { server backend:8000; }

  # HTTP — redirect to HTTPS + serve certbot challenges
  server {
    listen 80;
    server_name keystream.rockstreamer.com keystream.moviestreamhq.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location /health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS — both domains share same cert (SAN cert covers both)
  server {
    listen 443 ssl;
    server_name keystream.rockstreamer.com keystream.moviestreamhq.com;

    ssl_certificate     /etc/ssl/rocks-stream/fullchain.pem;
    ssl_certificate_key /etc/ssl/rocks-stream/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location /health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location /live/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range" always;
      add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range" always;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
